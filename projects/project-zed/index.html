<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<meta name="description" content="Task Tracker helps users organize projects, tasks, and deadlines.">

	<title>Task Tracker</title>

	<link rel="stylesheet" href="css/styles.css">
</head>

<body>
	<main>
		<header>
			<h1>Task Tracker</h1>
			<p>Keep track of your projects, tasks, and deadlines in one place.</p>
		</header>

		<section aria-labelledby="add-project-heading">
			<h2 id="add-project-heading">Add a Project</h2>

			<form id="project-form">
				<div>
					<label for="new-project-name">Project Name</label>
					<input type="text" id="new-project-name" name="new-project-name" required>
				</div>

				<div>
					<label for="new-project-due-date">Project Due Date</label>
					<input type="date" id="new-project-due-date" name="new-project-due-date" required>
				</div>

				<button type="submit">Add Project</button>
			</form>
		</section>

		<section aria-labelledby="add-task-heading">
			<h2 id="add-task-heading">Add a Task</h2>

			<form id="task-form">
				<div>
					<label for="project-select">Project</label>
					<select id="project-select" name="project-select" required>
						<option value="">Choose a project</option>
					</select>
				</div>

				<div>
					<label for="task-name">Task Name</label>
					<input type="text" id="task-name" name="task-name" required>
				</div>
				<div>
					<label for="task-details">Task Details</label>

					<textarea id="task-details" name="task-details" rows="4"
						placeholder="What needs to be done for this task?"></textarea>
				</div>

				<div>
					<label for="due-date">Task Due Date</label>
					<input type="date" id="due-date" name="due-date" required>
				</div>

				<button type="submit">Add Task</button>
			</form>
		</section>

		<section aria-labelledby="projects-heading">
			<h2 id="projects-heading">My Projects</h2>

			<p id="empty-message">
				No projects yet. Add your first project above.
			</p>

			<div id="task-list"></div>
		</section>
	</main>

	<script src="js/app.js" defer></script>
</body>

</html>
