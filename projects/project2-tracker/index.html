<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Favorites Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Local Favorites Tracker</h1>
        <p>Keep track of your favorite local places.</p>
    </header>

    <main>

        <section class="add-section">
            <h2>Add New Favorite</h2>

            <form id="add-favorite-form">

                <div class="form-group">
                    <label for="name">Place Name *</label>
                    <input type="text" id="name" name="name" required aria-required="true">
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required aria-required="true">
                        <option value="">Choose a category</option>
                        <option value="restaurants">Restaurant</option>
                        <option value="coffee">Coffee</option>
                        <option value="shopping">Shopping</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="outdoors">Outdoors</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rating">Rating *</label>
                    <select id="rating" name="rating" required aria-required="true">
                        <option value="">Choose a rating</option>
                        <option value="5">5 stars</option>
                        <option value="4">4 stars</option>
                        <option value="3">3 stars</option>
                        <option value="2">2 stars</option>
                        <option value="1">1 star</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Add Favorite</button>
                <button type="button" id="clear-all" class="btn-danger">
                Clear All Favorites
                </button>
            </form>
        </section>

        <section class="controls-section">
    <label for="search-input">Search favorites</label>
    <input type="search" id="search-input" placeholder="Search names and notes">

    <label for="category-filter">Filter by category</label>
    <select id="category-filter">
        <option value="all">All categories</option>
        <option value="restaurants">Restaurant</option>
        <option value="coffee">Coffee</option>
        <option value="shopping">Shopping</option>
        <option value="entertainment">Entertainment</option>
        <option value="outdoors">Outdoors</option>
    </select>

    <label for="rating-filter">Filter by rating</label>
    <select id="rating-filter">
        <option value="all">All ratings</option>
        <option value="5">5 stars</option>
        <option value="4">4 stars</option>
        <option value="3">3 stars</option>
        <option value="2">2 stars</option>
        <option value="1">1 star</option>
    </select>

        </section>

        <section class="favorites-section">
            <p id="favorites-count"></p>

            <div id="favorites-list" class="favorites-grid">
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Teri Quintana</p>
    </footer>

    <script src="js/app.js"></script>

</body>

</html>
